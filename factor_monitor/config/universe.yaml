# Universo de la fase 1 (SPEC v3 §4).
#
# IDs de Dukascopy verificados contra los metadatos de dukascopy-node 1.50.0
# (el comentario "desde" indica el inicio de los minutos cuando limita la historia).
# Un ID a null significa "no disponible": el instrumento se excluye con aviso.
# `dukascopy_code` es el código del API jetta (motor por defecto).
# `point_factor` solo lo usa el lector .bi5 de respaldo (precio = entero / factor);
# es una estimación y debe calibrarse con `build_bars calibrate` antes de usarlo.
# mt5_symbol: inventario de Darwinex (servidor Darwinex-Demo, UTC+3/UTC+2, 26-sep-2026).
# Sustitutos en vivo (el historial usa el instrumento de Dukascopy; el test de
# consistencia §3.5 mide cuánto se parecen y marca "no comparable" si baja de 0,90):
#   BRENT → XTIUSD (WTI contado; Darwinex no tiene Brent)
#   TBOND → TLT (ETF de bonos del Tesoro a +20 años; solo cotiza en horario de EE.UU.)
# Sin símbolo en Darwinex: Bund y todas las acciones europeas.

overlap_threshold: 0.20        # §5.3: exclusión de factores que contienen al objetivo

instruments:
  # --- Índices objetivo -------------------------------------------------------
  SPX:   {kind: target, dukascopy_id: usa500idxusd, dukascopy_code: USA500.IDX-USD,  mt5_symbol: SP500, session: us, exchange: XNYS, point_factor: 1000}
  SX5E:  {kind: target, dukascopy_id: eusidxeur, dukascopy_code: EUS.IDX-EUR,     mt5_symbol: STOXX50E, session: eu, exchange: XETR, point_factor: 1000}
  DAX:   {kind: target, dukascopy_id: deuidxeur, dukascopy_code: DEU.IDX-EUR,     mt5_symbol: GDAXI, session: eu, exchange: XETR, point_factor: 1000}
  CAC:   {kind: target, dukascopy_id: fraidxeur, dukascopy_code: FRA.IDX-EUR,     mt5_symbol: FCHI40, session: eu, exchange: XPAR, point_factor: 1000}
  IBEX:  {kind: target, dukascopy_id: espidxeur, dukascopy_code: ESP.IDX-EUR,     mt5_symbol: SPA35, session: eu, exchange: XMAD, point_factor: 1000}

  # --- Instrumentos de los factores ------------------------------------------
  NDX:    {kind: factor, dukascopy_id: usatechidxusd, dukascopy_code: USATECH.IDX-USD, mt5_symbol: NDX, session: us, exchange: XNYS, point_factor: 1000}
  BRENT:  {kind: factor, dukascopy_id: brentcmdusd, dukascopy_code: BRENT.CMD-USD,   mt5_symbol: XTIUSD, point_factor: 1000}
  BUND:   {kind: factor, dukascopy_id: bundtreur, dukascopy_code: BUND.TR-EUR,     mt5_symbol: null, point_factor: 1000}   # desde may-2016
  TBOND:  {kind: factor, dukascopy_id: ustbondtrusd, dukascopy_code: USTBOND.TR-USD,  mt5_symbol: TLT, point_factor: 1000}   # desde dic-2018
  EURUSD: {kind: factor, dukascopy_id: eurusd, dukascopy_code: EUR-USD,        mt5_symbol: EURUSD, point_factor: 100000}

  # --- Componentes de las cestas sectoriales (§4.2) ---------------------------
  # ISP, UCG y ENI solo tienen minutos desde dic-2020. TotalEnergies es `fpfreur`.
  # OMV no existe en Dukascopy: entra en la cesta diaria con yfinance (§3.3).
  BNP:   {kind: component, dukascopy_id: bnpfreur, dukascopy_code: BNP.FR-EUR, point_factor: 1000, yahoo_ticker: BNP.PA,  exchange: XPAR, session: eu}
  SAN:   {kind: component, dukascopy_id: saneseur, dukascopy_code: SAN.ES-EUR, point_factor: 1000, yahoo_ticker: SAN.MC,  exchange: XMAD, session: eu}
  INGA:  {kind: component, dukascopy_id: inganleur, dukascopy_code: INGA.NL-EUR, point_factor: 1000, yahoo_ticker: INGA.AS, exchange: XAMS, session: eu}
  ISP:   {kind: component, dukascopy_id: ispiteur, dukascopy_code: ISP.IT-EUR, point_factor: 1000, yahoo_ticker: ISP.MI,  exchange: XMIL, session: eu}
  UCG:   {kind: component, dukascopy_id: ucgiteur, dukascopy_code: UCG.IT-EUR, point_factor: 1000, yahoo_ticker: UCG.MI,  exchange: XMIL, session: eu}
  BBVA:  {kind: component, dukascopy_id: bbvaeseur, dukascopy_code: BBVA.ES-EUR, point_factor: 1000, yahoo_ticker: BBVA.MC, exchange: XMAD, session: eu}
  DBK:   {kind: component, dukascopy_id: dbkdeeur, dukascopy_code: DBK.DE-EUR, point_factor: 1000, yahoo_ticker: DBK.DE,  exchange: XETR, session: eu}
  GLE:   {kind: component, dukascopy_id: glefreur, dukascopy_code: GLE.FR-EUR, point_factor: 1000, yahoo_ticker: GLE.PA,  exchange: XPAR, session: eu}
  TTE:   {kind: component, dukascopy_id: fpfreur, dukascopy_code: FP.FR-EUR, point_factor: 1000, yahoo_ticker: TTE.PA,  exchange: XPAR, session: eu}
  ENI:   {kind: component, dukascopy_id: eniiteur, dukascopy_code: ENI.IT-EUR, point_factor: 1000, yahoo_ticker: ENI.MI,  exchange: XMIL, session: eu}
  REP:   {kind: component, dukascopy_id: repeseur, dukascopy_code: REP.ES-EUR, point_factor: 1000, yahoo_ticker: REP.MC,  exchange: XMAD, session: eu}
  GALP:  {kind: component, dukascopy_id: galppteur, dukascopy_code: GALP.PT-EUR, point_factor: 1000, yahoo_ticker: GALP.LS, exchange: XLIS, session: eu}
  OMV:   {kind: component, dukascopy_id: null, yahoo_ticker: OMV.VI,  exchange: XWBO, session: eu}

# Factores (§4.3). `sign: -1` invierte el retorno (bonos: sube = sube la
# rentabilidad; EUR/USD invertido = dólar). `contains` declara el peso con el
# que el factor contiene a cada objetivo, para la regla de §5.3.
factors:
  BRENT: {instrument: BRENT,  sign: 1}
  BUND:  {instrument: BUND,   sign: -1}
  TBOND: {instrument: TBOND,  sign: -1}
  USD:   {instrument: EURUSD, sign: -1}
  IA:    {long: NDX, short: SPX, contains: {SPX: 1.0}}

# Objetivos (§4.1, §5.1, §5.2).
targets:
  SPX:    {session: us, exchange: XNYS, candidates: [BRENT, TBOND, USD],     market: {type: none}}
  SX5E:   {session: eu, exchange: XETR, candidates: [BRENT, BUND, USD, IA],  market: {type: mean, members: [DAX, CAC, IBEX]}}
  DAX:    {session: eu, exchange: XETR, candidates: [BRENT, BUND, USD, IA],  market: {type: mean, members: [SX5E, CAC, IBEX]}}
  CAC:    {session: eu, exchange: XPAR, candidates: [BRENT, BUND, USD, IA],  market: {type: mean, members: [SX5E, DAX, IBEX]}}
  IBEX:   {session: eu, exchange: XMAD, candidates: [BRENT, BUND, USD, IA],  market: {type: mean, members: [SX5E, DAX, CAC]}}
  BANKS:  {session: eu, exchange: XETR, candidates: [BUND, TBOND],           market: {type: mean, members: [SX5E]},
           basket: [BNP, SAN, INGA, ISP, UCG, BBVA, DBK, GLE], reference_etf: EXV1.DE}
  ENERGY: {session: eu, exchange: XETR, candidates: [BRENT, USD],            market: {type: mean, members: [SX5E]},
           basket: [TTE, ENI, REP, GALP, OMV], reference_etf: EXH1.DE}
