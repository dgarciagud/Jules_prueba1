name: factor-monitor tests

on:
  push:
    paths: ["factor_monitor/**", ".github/workflows/factor-monitor-*.yml"]
  pull_request:
    paths: ["factor_monitor/**", ".github/workflows/factor-monitor-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: factor_monitor

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: factor_monitor/requirements-lock.txt
      - run: pip install -r requirements-lock.txt && pip install --no-deps -e .
      - run: pytest
