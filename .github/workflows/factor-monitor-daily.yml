name: factor-monitor daily

# Informe diario de sectores y factores: descarga de cierres diarios (Yahoo, Stooq de respaldo),
# pesos sectoriales, atribución, fuerza relativa y factores por sector. Publica index.html en la
# rama `results` (GitHub Pages) y guarda los datos en la release `daily-data` (respaldo para la
# noche siguiente).

on:
  schedule:
    - cron: "40 22 * * 1-5"   # tras el cierre de EE.UU. (22:00 UTC en invierno)
  workflow_dispatch:

concurrency:
  group: factor-monitor-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: factor_monitor
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: daily-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: factor_monitor/requirements-lock.txt
      - name: Instalar dependencias
        run: pip install -r requirements-lock.txt && pip install --no-deps -e .

      - name: Copia anterior
        run: |
          mkdir -p previous
          gh release download "$RELEASE" --dir previous --clobber || echo "Sin copia anterior"

      - name: Datos
        id: data
        run: |
          set +e
          python -m factor_monitor.daily.run --out daily_out --previous previous --site site
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Resumen
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pandas as pd
          m = json.load(open("daily_out/data_meta.json"))
          print(f"### Datos hasta {m['data_end']}\n")
          print("Fuentes:", m["sources"], "\n")
          for k, t in m["tracking"].items():
              print(f"- {k}: R² sectores→índice {t['r2']:.4f}, error de seguimiento {t['te_annual']:.2%} anual")
          a = pd.read_parquet("daily_out/attribution.parquet")
          for ix, g in a[(a.period == "1S") & a.level.isin(["index", "sector", "residual"])].groupby("index"):
              tot = g[g.level == "index"].iloc[0]
              print(f"\n#### {ix}: {tot['contribution']:+.2%} en la semana ({tot['from']} a {tot['to']})\n")
              for _, r in g[g.level != "index"].sort_values("contribution", ascending=False).iterrows():
                  print(f"- {r['name']}: {r['contribution'] * 100:+.2f} pp")
          f = pd.read_parquet("daily_out/factor_shapley.parquet")
          f = f[f.date == f.groupby("index").date.transform("max")]
          for ix, g in f.groupby("index"):
              print(f"\n#### {ix}: factor macro principal por sector (ventana de 6 meses)\n")
              for t, gg in g.groupby("target_name"):
                  m = gg[gg.factor != "MKT"].sort_values("shapley", ascending=False).iloc[0]
                  print(f"- {t}: {m['factor']} {m['share']:.0%} ({'+' if m['std_beta'] > 0 else '−'}), R² {m['r2']:.2f}")
          cov = pd.read_csv("daily_out/coverage.csv")
          print("\n```\n" + cov[["id", "source", "symbol", "first", "last", "n", "stale"]].to_string(index=False) + "\n```")
          if m["warnings"]:
              print("\n#### Avisos\n")
              for w in m["warnings"]:
                  print(f"- [{w['step']}] {w['message']}")
          EOF

      - name: Guardar en la release
        if: always()
        run: |
          gh release view "$RELEASE" >/dev/null 2>&1 || gh release create "$RELEASE" --title "Datos diarios" --notes "Última descarga del informe diario (se sobrescribe cada noche)." || true
          gh release upload "$RELEASE" daily_out/* --clobber

      - name: Publicar en GitHub Pages (rama results)
        if: always()
        working-directory: .
        run: |
          [ -f factor_monitor/site/index.html ] || { echo "Sin informe"; exit 0; }
          git config user.name "factor-monitor[bot]"
          git config user.email "factor-monitor@users.noreply.github.com"
          if git fetch --depth 1 origin results; then
            git worktree add pages FETCH_HEAD && git -C pages checkout -q -B results
          else
            git worktree add --orphan -b results pages
          fi
          find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp factor_monitor/site/index.html factor_monitor/site/.nojekyll factor_monitor/daily_out/data_meta.json pages/
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -q -m "informe $(date -u +%F)"
            git push -q origin results
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily_out
          path: |
            factor_monitor/daily_out
            factor_monitor/site
          retention-days: 14

      - name: Estado final
        run: exit "${{ steps.data.outputs.exit_code || 1 }}"
