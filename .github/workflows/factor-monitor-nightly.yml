name: factor-monitor nightly

# Pipeline nocturno (SPEC v3 §10.1): incremental de Dukascopy, capa diaria,
# selección semanal y velas recientes. Publica en la rama huérfana `results`.

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      full:
        description: "Recalcular la capa diaria entera"
        type: boolean
        default: false
      years:
        description: "Años de velas que lee la capa diaria"
        default: "2"
      force_selection:
        description: "Forzar la selección aunque no sea fin de semana hábil"
        type: boolean
        default: false

concurrency:
  group: factor-monitor-data-store
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: factor_monitor/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: factor_monitor/package-lock.json
      - name: Instalar dependencias
        working-directory: factor_monitor
        run: |
          npm ci --no-audit --no-fund
          pip install -r requirements-lock.txt && pip install --no-deps -e .

      - name: Preparar la rama results
        run: |
          git config user.name "factor-monitor[bot]"
          git config user.email "factor-monitor@users.noreply.github.com"
          if git fetch --depth 1 origin results; then
            git worktree add results FETCH_HEAD
            git -C results checkout -B results
          else
            git worktree add --orphan -b results results
          fi

      - name: Pipeline
        id: pipeline
        working-directory: factor_monitor
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
          YEARS: ${{ inputs.years || '2' }}
          FORCE_SELECTION: ${{ inputs.force_selection }}
        run: |
          args=(--results-dir ../results --years "$YEARS")
          [ "$FULL" = "true" ] && args+=(--full)
          [ "$FORCE_SELECTION" = "true" ] && args+=(--force-selection)
          set +e
          python -m factor_monitor.nightly.run "${args[@]}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publicar resultados
        if: always()
        working-directory: results
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios en results"
          else
            git commit -q -m "results $(date -u +%F)"
            git push origin results
          fi

      - name: Estado final
        if: always()
        run: |
          if [ -f results/run_meta.json ]; then
            python -c "import json; m=json.load(open('results/run_meta.json')); print('Fin de datos:', m['data_end']); [print(f'::warning::{w[\"message\"]}') for w in m['warnings']]"
          fi
          exit "${{ steps.pipeline.outputs.exit_code || 1 }}"
